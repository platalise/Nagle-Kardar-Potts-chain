[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nkpotts"
version = "0.1.0"
description = "Exact solution, Monte Carlo, and information-theoretic parameter inference for the Nagle-Kardar-Potts chain"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Author Name", email = "author@university.edu.vn" }]
requires-python = ">=3.10"
keywords = [
    "statistical-physics",
    "phase-transitions",
    "monte-carlo",
    "long-range-interactions",
    "graph-neural-networks",
    "parameter-inference",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.6",
    "numba>=0.58",
    "tqdm>=4.65",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml = ["torch>=2.0", "torch_geometric>=2.4"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/OWNER/nkpotts"
Paper = "https://arxiv.org/abs/XXXX.XXXXX"
Issues = "https://github.com/OWNER/nkpotts/issues"

[tool.setuptools]
packages = ["nkpotts"]
